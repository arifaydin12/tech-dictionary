name: tech_dictionary
description: "Tech Dictionary - learn IT and computing terms with quizzes, spaced repetition and progress tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  pdf: ^3.13.1
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Roboto is bundled so the web build does not download fonts at runtime.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
